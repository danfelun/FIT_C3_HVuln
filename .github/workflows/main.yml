name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Bash scripts
        run: |
          bash -n setup.sh
          bash -n lab.sh
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
